<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Drop // Yuborish</title>
<style>
  :root{color-scheme:dark;--bg:#070b09;--panel:#0d1410;--panel-2:#090f0c;--line:#1d3326;--fg:#e2f5e8;--mut:#82988a;--acc:#56f287;--ok:#56f287;--err:#ff657a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;background-color:var(--bg);background-image:linear-gradient(rgba(86,242,135,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(86,242,135,.035) 1px,transparent 1px),radial-gradient(ellipse at 50% 0%,#12351f 0,transparent 58%);background-size:36px 36px,36px 36px,auto;color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
  .card{width:100%;max-width:590px;position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(15,25,19,.98),rgba(9,15,12,.98));border:1px solid var(--line);border-radius:8px;padding:clamp(22px,5vw,36px);box-shadow:0 24px 80px #0009,0 0 44px #39e8780a}
  .card:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.8}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px;color:var(--mut);font:11px/1.4 Consolas,"Courier New",monospace;letter-spacing:.13em;text-transform:uppercase}
  .brand{display:flex;align-items:center;gap:9px;color:var(--acc)}
  .brand-mark{width:9px;height:9px;border:1px solid var(--acc);box-shadow:0 0 10px #56f28799;transform:rotate(45deg)}
  .status{display:flex;align-items:center;gap:7px}
  .status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 9px var(--acc)}
  h1{margin:0;color:#f0fff4;font:700 clamp(25px,6vw,34px)/1.15 Consolas,"Courier New",monospace;letter-spacing:-.05em}
  h1 span{color:var(--acc)}
  .intro{margin:10px 0 27px;color:var(--mut);font-size:14px}
  .field-label{display:block;margin:0 0 7px;color:#a8c0af;font:11px Consolas,"Courier New",monospace;letter-spacing:.1em;text-transform:uppercase}
  input,textarea{width:100%;margin:0 0 17px;padding:12px 14px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:14px/1.5 Consolas,"Courier New",monospace;transition:border-color .18s,box-shadow .18s}
  input::placeholder,textarea::placeholder{color:#596a5e}
  input:focus,textarea:focus{outline:none;border-color:#56f287a8;box-shadow:0 0 0 3px #56f28712}
  textarea{min-height:125px;resize:vertical}
  #drop{border:1px dashed #31543c;border-radius:4px;padding:23px 14px;text-align:center;color:#a5c3ad;cursor:pointer;transition:.18s;margin-bottom:15px;background:#56f28705}
  #drop:hover,#drop:focus-visible,#drop.over{outline:none;border-color:var(--acc);color:var(--fg);background:#56f2870c;box-shadow:inset 0 0 24px #56f28708}
  .drop-icon{display:block;margin-bottom:7px;color:var(--acc);font:22px Consolas,"Courier New",monospace}
  #drop small{display:block;margin-top:5px;color:var(--mut);font:12px Consolas,"Courier New",monospace}
  ul{list-style:none;margin:0 0 15px;padding:0}
  li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;background:#080e0a;font:13px Consolas,"Courier New",monospace}
  li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .s{color:var(--mut);white-space:nowrap}
  li.ok .s{color:var(--ok)} li.err .s{color:var(--err)}
  li button{background:none;border:0;color:var(--err);cursor:pointer;font-size:16px}
  #send{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:1px solid var(--acc);border-radius:4px;background:var(--acc);color:#07100a;font:700 14px Consolas,"Courier New",monospace;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:background .18s,box-shadow .18s,transform .18s}
  #send:after{content:"→";font-size:18px}
  #send:hover:not(:disabled){background:#7dffa1;box-shadow:0 0 25px #56f28740;transform:translateY(-1px)}
  #send:focus-visible{outline:2px solid #d5ffe1;outline-offset:3px}
  #send:disabled{opacity:.5;cursor:not-allowed}
  #msg{margin-top:12px;color:var(--mut);font:12px Consolas,"Courier New",monospace;min-height:18px}
  .footnote{display:flex;justify-content:space-between;gap:12px;margin-top:23px;padding-top:14px;border-top:1px solid #1b2b20;color:#617567;font:10px Consolas,"Courier New",monospace;letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:420px){body{padding:18px 12px}.topline{margin-bottom:24px}.footnote{font-size:9px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="topline">
    <div class="brand"><span class="brand-mark"></span> SECURE DROP / 01</div>
    <div class="status">Tizim faol</div>
  </div>
  <h1><span>&gt;_</span> Ma'lumot yuborish</h1>
  <p class="intro">Xabar va fayllaringizni xavfsiz kanal orqali uzating.</p>
  <label class="field-label" for="sender">Kimdan / ixtiyoriy</label>
  <input id="sender" placeholder="Ismingizni kiriting" maxlength="60">
  <label class="field-label" for="text">Xabar matni</label>
  <textarea id="text" placeholder="Xabaringizni shu yerga yozing..."></textarea>
  <label class="field-label" for="file">Fayllar / maksimal 5 MB</label>
  <div id="drop" role="button" tabindex="0" aria-label="Fayllarni tanlang yoki shu yerga tashlang">
    <span class="drop-icon">[ + ]</span>
    Fayllarni shu yerga tashlang yoki tanlash uchun bosing
    <small>Yoki Ctrl+V orqali joylang · rasm, video, hujjat</small>
  </div>
  <input id="file" type="file" multiple hidden>
  <ul id="list"></ul>
  <button id="send">Yuborishni boshlash</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="footnote"><span>Secure connection</span><span>End of transmission</span></div>
</div>

<script>
const MAX = 5.5 * 1024 * 1024;
const $ = id => document.getElementById(id);
let files = [];

const fmt = b => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.ceil(b/1024)+' KB';

function render(){
  $('list').innerHTML = '';
  files.forEach((f,i)=>{
    const li = document.createElement('li');
    li.id = 'f'+i;
    li.innerHTML = `<span class="n"></span><span class="s">${fmt(f.size)}</span><button title="Olib tashlash">✕</button>`;
    li.querySelector('.n').textContent = f.name;
    li.querySelector('button').onclick = ()=>{ files.splice(i,1); render(); };
    $('list').appendChild(li);
  });
}
function add(list){
  for (const f of list){
    if (f.size > MAX){ $('msg').textContent = `"${f.name}" juda katta (${fmt(f.size)}). Maks: 5 MB.`; continue; }
    files.push(f);
  }
  render();
}

const drop = $('drop');
drop.onclick = ()=> $('file').click();
drop.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('file').click(); } };
$('file').onchange = e => { add(e.target.files); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop', e => add(e.dataTransfer.files));
window.addEventListener('dragover', e=>e.preventDefault());
window.addEventListener('drop', e=>{ e.preventDefault(); if(!drop.contains(e.target)) add(e.dataTransfer.files); });
window.addEventListener('paste', e => add([...e.clipboardData.files]));

async function post(headers, body){
  const r = await fetch('/.netlify/functions/send', { method:'POST', headers, body });
  if (!r.ok) throw new Error(await r.text() || r.status);
}

$('send').onclick = async () => {
  const text = $('text').value.trim();
  const sender = $('sender').value.trim();
  if (!text && !files.length){ $('msg').textContent = 'Matn yoki fayl qo\'shing.'; return; }
  $('send').disabled = true; $('msg').textContent = 'Yuborilmoqda...';
  const h = { 'x-sender': encodeURIComponent(sender) };
  let failed = 0;
  try {
    if (text) await post({ ...h, 'x-kind':'text', 'content-type':'text/plain; charset=utf-8' }, text);
    $('text').value = '';
  } catch(e){ failed++; $('msg').textContent = 'Matn xatosi: '+e.message; }

  for (let i=0;i<files.length;i++){
    const li = $('f'+i), s = li.querySelector('.s');
    s.textContent = '⏳';
    try {
      await post({ ...h, 'x-kind':'file', 'x-filename': encodeURIComponent(files[i].name),
                   'content-type': files[i].type || 'application/octet-stream' }, files[i]);
      li.classList.add('ok'); s.textContent = '✓';
    } catch(e){ failed++; li.classList.add('err'); s.textContent = '✗'; }
  }
  $('msg').textContent = failed ? `${failed} ta xato bo'ldi.` : '✅ Yuborildi!';
  if (!failed){ files = []; setTimeout(render, 1200); }
  $('send').disabled = false;
};
</script>
</body>
</html>
